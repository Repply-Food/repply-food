<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background-color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f5f5;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px;max-width:100%;background-color:#ffffff;border:1px solid #e5e5e5;border-radius:12px;">
            <tr>
              <td style="padding:32px 32px 0 32px;">
                <img src="{{ .SiteURL }}/icon-192.png" width="48" height="48" alt="repply food." style="display:block;border:0;border-radius:10px;" />
                <div style="margin-top:16px;font-size:18px;font-weight:700;color:#0A0A0A;">repply food<span style="color:#FF5A1F;">.</span></div>
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0 32px;">
                <h1 style="margin:16px 0 8px 0;font-size:22px;line-height:1.3;font-weight:700;color:#0A0A0A;">Crie sua senha nova</h1>
                <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#404040;">Recebemos um pedido para criar uma senha nova no repply food<span style="color:#FF5A1F;">.</span></p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 8px 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="background-color:#FF5A1F;border-radius:8px;">
                      <a href="{{ .SiteURL }}/auth/confirmar?token_hash={{ .TokenHash }}&type=recovery&next=/nova-senha" style="display:inline-block;padding:14px 26px;font-size:15px;font-weight:700;line-height:1;color:#0A0A0A;text-decoration:none;">Criar minha senha nova</a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 32px 32px;">
                <p style="margin:0;font-size:13px;line-height:1.6;color:#595959;">O link vale por 1 hora. Se n&atilde;o foi voc&ecirc;, ignore este e-mail: sua senha continua a mesma.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
